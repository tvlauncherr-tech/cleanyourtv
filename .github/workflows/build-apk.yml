name: Build APK

# Builds the launcher APK in the cloud, so no computer is needed: run it from the Actions tab
# (Build APK > Run workflow), then download "launcher-apk" from the finished run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    name: Unit tests and release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: APK size
        run: ls -l launcher/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
